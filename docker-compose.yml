name: filemint

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filemint
      POSTGRES_USER: filemint
      POSTGRES_PASSWORD: ${FILEMINT_DB_PASSWORD:-filemint-local-only}
    volumes:
      - filemint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filemint -d filemint']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: .
    environment:
      NODE_ENV: development
      PORT: 8787
      DATABASE_URL: postgresql://filemint:${FILEMINT_DB_PASSWORD:-filemint-local-only}@postgres:5432/filemint
      DATABASE_POOL_MAX: 4
      FILEMINT_PUBLIC_URL: http://localhost:8081
      CORS_ORIGINS: http://localhost:8081
      LOG_LEVEL: info
    ports:
      - '8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8787/health']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
      - /app/server/data:rw,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  filemint-postgres:
