name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_PUBLIC_FILEMINT_SERVER_URL: http://localhost:8787
  FILEMINT_PUBLIC_URL: http://localhost:8081
  CORS_ORIGINS: http://localhost:8081
  LOG_LEVEL: silent

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python quality tools
        run: python -m pip install -r server/requirements-dev.lock.txt
      - name: Check formatting
        run: npm run format:check
      - name: Enforce focused code modules
        run: npm run check:file-size
      - name: Lint app and server
        run: npm run lint
      - name: Lint and format-check Python helpers
        run: npm run lint:python
      - name: Check Expo SDK package compatibility
        run: npm run expo:check
      - name: Compile-check Python helpers
        run: python -m compileall -q server

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck app and server
        run: npm run typecheck

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock.txt
            server/requirements-dev.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python dependencies
        run: python -m pip install -r server/requirements.lock.txt -r server/requirements-dev.lock.txt
      - name: Verify the Python dependency graph
        run: python -m pip check
      - name: Run TypeScript tests with coverage
        run: npm test -- --coverage
      - name: Run Python tests with branch coverage
        run: npm run test:python:coverage
      - name: Verify server health and metrics
        run: npm run server:smoke

  build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export production web app
        run: npm run build:web
      - name: Preserve production web artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: filemint-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  container:
    name: Container build and health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: filemint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name filemint-ci --publish 8787:8787 \
            --env FILEMINT_PUBLIC_URL=http://localhost:8081 \
            --env CORS_ORIGINS=http://localhost:8081 \
            --env LOG_LEVEL=silent \
            --env FILEMINT_AUTH_CODE_PEPPER=filemint-ci-only-auth-code-pepper-123456 \
            filemint:ci
          trap 'docker logs filemint-ci; docker rm --force filemint-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject new high or critical advisories
        run: npm run audit
      - name: Audit isolated production server dependencies
        run: npm run audit --prefix server
