name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_PUBLIC_FILEMINT_SERVER_URL: http://localhost:8787
  FILEMINT_PUBLIC_URL: http://localhost:8081
  CORS_ORIGINS: http://localhost:8081
  LOG_LEVEL: silent

jobs:
  quality:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint app and server
        run: npm run lint
      - name: Check Expo SDK package compatibility
        run: npm run expo:check
      - name: Typecheck app and server
        run: npm run typecheck
      - name: Compile-check Python helpers
        run: python -m compileall -q server

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python dependencies
        run: python -m pip install -r server/requirements.lock.txt
      - name: Run TypeScript coverage and Python tests
        run: npm run test:all
      - name: Verify server health and metrics
        run: npm run server:smoke

  build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export production web app
        run: npm run build:web

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject new high or critical advisories
        run: npm run audit
