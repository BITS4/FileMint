name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_PUBLIC_FILEMINT_SERVER_URL: http://localhost:8787
  FILEMINT_PUBLIC_URL: http://localhost:8081
  CORS_ORIGINS: http://localhost:8081
  LOG_LEVEL: silent

jobs:
  quality:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements-dev.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python quality tools
        run: python -m pip install -r server/requirements-dev.lock.txt
      - name: Check formatting
        run: npm run format:check
      - name: Enforce focused code modules
        run: npm run check:file-size
      - name: Lint app and server
        run: npm run lint
      - name: Lint and format-check Python helpers
        run: npm run lint:python
      - name: Check Expo SDK package compatibility
        run: npm run expo:check
      - name: Typecheck app and server
        run: npm run typecheck
      - name: Compile-check Python helpers
        run: python -m compileall -q server

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock.txt
            server/requirements-dev.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python dependencies
        run: python -m pip install -r server/requirements.lock.txt -r server/requirements-dev.lock.txt
      - name: Run TypeScript tests with coverage
        run: npm run test:coverage
      - name: Run Python tests with branch coverage
        run: npm run test:python:coverage
      - name: Verify server health and metrics
        run: npm run server:smoke

  build:
    name: Production web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Export production web app
        run: npm run build:web

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject new high or critical advisories
        run: npm run audit
