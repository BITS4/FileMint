name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.lock.txt
            server/requirements-dev.lock.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Python dependencies
        run: python -m pip install -r server/requirements.lock.txt -r server/requirements-dev.lock.txt
      - name: Verify dependency graph
        run: |
          python -m pip check
          npm run audit
          npm run audit --prefix server
      - name: Run the complete release gate
        run: |
          npm run verify
          npm run expo:check
          npm run server:smoke
      - name: Package the verified web application
        shell: bash
        run: |
          set -euo pipefail
          archive="filemint-web-${GITHUB_REF_NAME}.zip"
          cd dist
          zip -q -r "../${archive}" .
          cd ..
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Publish GitHub release and checksummed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="filemint-web-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" "${archive}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" "${archive}.sha256" \
              --title "FileMint ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
